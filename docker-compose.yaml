services:
  SenseVoice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
    image: aisolution-sensevoice:latest
    container_name: aisolution-sensevoice
    runtime: habana
    tty: true
    stdin_open: true
    environment:
      - HABANA_VISIBLE_DEVICES=all
      - OMPI_MCA_btl_vader_single_copy_mechanism=none
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - PT_HPU_LAZY_MODE=1
    cap_add:
      - SYS_NICE
    network_mode: host
    ipc: host
    working_dir: /workspace/SenseVoice
    command: ["python", "webui.py"]
    restart: unless-stopped
